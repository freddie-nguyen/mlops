# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [feature/inference-service]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push inference image
        uses: docker/build-push-action@v5
        with:
          context: ./inference
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-inference:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-inference:${{ github.sha }}

      - name: Build and push consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./consumer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-consumer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anomaly-consumer:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/mlops-kafka
            docker compose pull inference consumer
            docker compose up -d inference consumer